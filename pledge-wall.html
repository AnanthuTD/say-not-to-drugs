<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Anti-Drug Pledge Wall - Say No to Drugs</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Permanent+Marker&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
		/>
	</head>
	<body class="wall-background min-h-screen">
		<!-- Progress Bar -->
		<div class="progress-bar">
			<div class="progress-bar-fill"></div>
		</div>

		<!-- Header -->
		<header class="w-full p-4 bg-white bg-opacity-90 shadow-md">
			<div class="max-w-7xl mx-auto flex justify-between items-center">
				<h1 class="text-3xl font-['Poppins'] font-bold text-primary">
					Our Pledge Wall
				</h1>
				<div class="flex items-center space-x-4">
					<a
						href="index.html"
						class="px-4 py-2 bg-gray-200 text-gray-700 rounded-button hover:bg-gray-300 ripple"
						>Back to Home</a
					>
					<button
						id="openPledgeModal"
						class="px-4 py-2 bg-primary text-white hover:bg-opacity-90 transition-all rounded-button flex items-center ripple"
						aria-label="Add your pledge"
					>
						<span class="w-5 h-5 flex items-center justify-center mr-2">
							<i class="ri-add-line"></i>
						</span>
						Add Your Pledge
					</button>
				</div>
			</div>
		</header>

		<!-- Main Content -->
		<main
			class="max-w-7xl mx-auto p-4 md:p-8 min-h-[calc(100vh-80px)] zoomable"
			style="transform-origin: 0 0"
		>
			<div
				class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8"
				id="pledgeGrid"
				aria-live="polite"
			></div>
		</main>

		<!-- Pledge Modal -->
		<div
			id="pledgeModal"
			class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
			aria-hidden="true"
		>
			<div
				class="bg-white rounded-lg p-6 w-full max-w-md"
				role="dialog"
				aria-labelledby="pledgeModalTitle"
			>
				<div class="flex justify-between items-center mb-4">
					<h2 id="pledgeModalTitle" class="text-xl font-bold">
						Add Your Pledge
					</h2>
					<button
						id="closeModal"
						class="text-gray-500 hover:text-gray-700"
						aria-label="Close modal"
					>
						<i class="ri-close-line ri-lg"></i>
					</button>
				</div>
				<form id="pledgeForm" class="space-y-4">
					<div>
						<label for="name" class="block mb-1 font-medium">Your Name</label>
						<input
							type="text"
							id="name"
							maxlength="50"
							class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary"
							required
							aria-describedby="nameHelp"
						/>
						<p id="nameHelp" class="text-sm text-gray-500">
							Enter your full name or pseudonym.
						</p>
					</div>
					<div>
						<label for="pledgeText" class="block mb-1 font-medium"
							>Your Pledge</label
						>
						<textarea
							id="pledgeText"
							maxlength="100"
							rows="4"
							class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary"
							required
							aria-describedby="pledgeTextHelp"
						></textarea>
						<p id="pledgeTextHelp" class="text-sm text-gray-500">
							<span id="charCount">0</span>/100 characters
						</p>
					</div>
					<div class="flex justify-between">
						<div>
							<label class="block mb-1 font-medium">Note Color</label>
							<div class="flex space-x-2">
								<button
									type="button"
									class="w-8 h-8 bg-yellow-200 rounded-full border-2 border-gray-600 color-option"
									data-color="bg-yellow-200"
									aria-label="Yellow note"
								></button>
								<button
									type="button"
									class="w-8 h-8 bg-blue-200 rounded-full border-2 border-transparent hover:border-gray-400 color-option"
									data-color="bg-blue-200"
									aria-label="Blue note"
								></button>
								<button
									type="button"
									class="w-8 h-8 bg-green-200 rounded-full border-2 border-transparent hover:border-gray-400 color-option"
									data-color="bg-green-200"
									aria-label="Green note"
								></button>
								<button
									type="button"
									class="w-8 h-8 bg-pink-200 rounded-full border-2 border-transparent hover:border-gray-400 color-option"
									data-color="bg-pink-200"
									aria-label="Pink note"
								></button>
							</div>
						</div>
						<div>
							<label class="block mb-1 font-medium">Rotation</label>
							<div class="flex items-center space-x-2">
								<button
									type="button"
									class="w-8 h-8 border rounded hover:bg-gray-100 rotation-btn"
									data-rotation="-1"
									aria-label="Rotate left"
								>
									<i class="ri-anticlockwise-line"></i>
								</button>
								<span id="rotationValue">0°</span>
								<button
									type="button"
									class="w-8 h-8 border rounded hover:bg-gray-100 rotation-btn"
									data-rotation="1"
									aria-label="Rotate right"
								>
									<i class="ri-clockwise-line"></i>
								</button>
							</div>
						</div>
					</div>
					<button
						type="submit"
						class="w-full py-2 bg-primary text-white rounded-button hover:bg-opacity-90 ripple"
					>
						Post Pledge
					</button>
				</form>
			</div>
		</div>

		<script type="module" src="/src/pledge-wall.js"></script>
	</body>
</html>
